name: Refresh dashboard data

on:
  workflow_dispatch: {}    # manual only — trigger from the repo's Actions tab: "Refresh dashboard data" → "Run workflow"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh data.js from Enka.network, WuwaBuilds and the Riot API
        run: node scripts/refresh-data.mjs
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: auto-refresh dashboard data"
          git push
